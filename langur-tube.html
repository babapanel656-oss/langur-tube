<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Langur Tube</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial,sans-serif}
header{height:64px;background:#111;border-bottom:1px solid #292929;display:flex;align-items:center;padding:0 18px;gap:18px;position:sticky;top:0;z-index:10}
.logo{font-size:21px;font-weight:800}.logo b{color:#ff1744}.menu,.headbtn{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.search{display:flex;flex:1;max-width:650px;margin:auto}.search input{flex:1;background:#0b0b0b;color:#fff;border:1px solid #444;padding:12px 18px;border-radius:24px 0 0 24px;outline:none}.search button{width:58px;background:#222;color:#fff;border:1px solid #444;border-left:0;border-radius:0 24px 24px 0}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#7953d2;font-weight:bold}
aside{position:fixed;top:64px;bottom:0;width:235px;padding:14px 10px;background:#0f0f0f;border-right:1px solid #222;transition:.2s}
.nav{display:flex;gap:17px;padding:12px 15px;color:#fff;text-decoration:none;border-radius:9px;margin:3px 0}.nav:hover,.nav.active{background:#282828}.sep{height:1px;background:#292929;margin:15px 7px}
main{margin-left:235px;padding:20px 24px}.chips{display:flex;gap:9px;overflow:auto;margin-bottom:20px}.chip{border:0;background:#272727;color:#fff;padding:9px 15px;border-radius:9px;white-space:nowrap}.chip.active{background:#fff;color:#111}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 16px}.thumb{aspect-ratio:16/9;background:#222;border-radius:10px;overflow:hidden;position:relative;cursor:pointer}.thumb img{width:100%;height:100%;object-fit:cover}.duration{position:absolute;bottom:6px;right:6px;background:#000d;padding:3px 5px;border-radius:4px;font-size:12px}.info{display:flex;gap:10px;padding-top:10px}.cavatar{width:36px;height:36px;flex:none;border-radius:50%;background:#444;display:grid;place-items:center;font-weight:bold}.title{font-size:15px;font-weight:600;line-height:1.35;margin:0 0 5px}.meta{font-size:13px;color:#aaa;line-height:1.45}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal.show{display:flex}.box{background:#181818;border:1px solid #333;border-radius:14px;width:min(850px,96vw);padding:20px}.video{width:100%;max-height:70vh;background:#000}.close{float:right;background:#292929;border:0;color:#fff;border-radius:50%;width:34px;height:34px;font-size:20px}.field{margin:14px 0}.field label{display:block;color:#ccc;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;background:#0e0e0e;color:#fff;border:1px solid #444;border-radius:8px}.primary{background:#ff1744;color:#fff;border:0;padding:11px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
.empty{text-align:center;color:#888;padding:60px;display:none}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){aside{width:68px}aside .txt{display:none}.nav{justify-content:center;padding:13px 0}main{margin-left:68px;padding:15px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){header{gap:8px}.logo{font-size:17px}.grid{grid-template-columns:1fr}main{margin-left:60px;padding:12px}aside{width:60px}}
</style>
</head>
<body>
<header>
<button class="menu" onclick="toggleSide()">☰</button>
<div class="logo">Langur <b>Tube</b></div>
<div class="search"><input id="q" placeholder="Search videos..." onkeydown="if(event.key==='Enter')search()"><button onclick="search()">⌕</button></div>
<button class="headbtn" onclick="openUpload()">＋</button><div class="avatar">U</div>
</header>

<aside id="side">
<a class="nav active" href="#" onclick="home(event)">🏠 <span class="txt">Home</span></a>
<a class="nav" href="#" onclick="trending(event)">🔥 <span class="txt">Trending</span></a>
<a class="nav" href="#">📺 <span class="txt">Subscriptions</span></a>
<div class="sep"></div>
<a class="nav" href="#">🕘 <span class="txt">History</span></a>
<a class="nav" href="#">👍 <span class="txt">Liked videos</span></a>
<div class="sep"></div>
<a class="nav" href="#" onclick="openUpload(event)">⬆️ <span class="txt">Upload video</span></a>
</aside>

<main>
<div class="chips" id="chips">
<button class="chip active" onclick="category('All',this)">All</button>
<button class="chip" onclick="category('Gaming',this)">Gaming</button>
<button class="chip" onclick="category('Music',this)">Music</button>
<button class="chip" onclick="category('Technology',this)">Technology</button>
<button class="chip" onclick="category('Education',this)">Education</button>
<button class="chip" onclick="category('Travel',this)">Travel</button>
</div>
<section id="grid" class="grid"></section>
<div id="empty" class="empty"><h2>No videos found</h2><p>Try another search.</p></div>
</main>

<div id="playerModal" class="modal" onclick="if(event.target===this)closePlayer()">
<div class="box"><button class="close" onclick="closePlayer()">×</button><video id="player" class="video" controls></video><h2 id="ptitle"></h2><div id="pmeta" class="meta"></div></div>
</div>

<div id="uploadModal" class="modal" onclick="if(event.target===this)closeUpload()">
<div class="box">
<button class="close" onclick="closeUpload()">×</button><h2>Upload video</h2>
<div class="field"><label>Video title</label><input id="utitle" placeholder="Enter video title"></div>
<div class="field"><label>Category</label><select id="ucat"><option>Gaming</option><option>Music</option><option>Technology</option><option>Education</option><option>Travel</option></select></div>
<div class="field"><label>Video file</label><input id="ufile" type="file" accept="video/*"></div>
<button class="primary" onclick="upload()">Publish Video</button>
<p class="meta">Demo version: uploaded files work in this browser session.</p>
</div></div>

<script>
const videos=[
{t:"Epic Gaming Battle",c:"Langur Gaming",v:"1.2M views",d:"12:41",cat:"Gaming",a:"G",i:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=900",s:""},
{t:"Amazing City Tour",c:"Travel World",v:"428K views",d:"08:25",cat:"Travel",a:"T",i:"https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=900",s:""},
{t:"How Artificial Intelligence Works",c:"Tech Lab",v:"903K views",d:"15:02",cat:"Technology",a:"T",i:"https://images.unsplash.com/photo-1677442136019-21780ecad995?w=900",s:""},
{t:"Relaxing Music Mix",c:"Langur Music",v:"2.8M views",d:"45:18",cat:"Music",a:"M",i:"https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=900",s:""},
{t:"Learn JavaScript",c:"Code School",v:"540K views",d:"24:10",cat:"Education",a:"C",i:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=900",s:""}];

function render(list=videos){grid.innerHTML="";empty.style.display=list.length?"none":"block";list.forEach((x,n)=>{grid.innerHTML+=`<article><div class="thumb" onclick="play(${n})"><img src="${x.i}"><span class="duration">${x.d}</span></div><div class="info"><div class="cavatar">${x.a}</div><div><p class="title">${esc(x.t)}</p><div class="meta">${esc(x.c)}<br>${x.v} • Just now</div></div></div></article>`})}
function esc(x){return x.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function search(){let q=document.getElementById("q").value.toLowerCase();render(videos.filter(x=>(x.t+" "+x.c+" "+x.cat).toLowerCase().includes(q)))}
function category(cat,b){document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(cat==="All"?videos:videos.filter(x=>x.cat===cat))}
function play(n){let x=videos[n];ptitle.textContent=x.t;pmeta.textContent=x.c+" • "+x.v;player.src=x.s;playerModal.classList.add("show");if(x.s)player.play().catch(()=>{})}
function closePlayer(){player.pause();player.src="";playerModal.classList.remove("show")}
function openUpload(e){if(e)e.preventDefault();uploadModal.classList.add("show")}
function closeUpload(){uploadModal.classList.remove("show")}
function upload(){let f=ufile.files[0];if(!f){alert("Please select a video.");return}videos.unshift({t:utitle.value.trim()||"My New Video",c:"You",v:"0 views",d:"NEW",cat:ucat.value,a:"Y",i:"https://images.unsplash.com/photo-1492724441997-5dc865305da7?w=900",s:URL.createObjectURL(f)});utitle.value="";ufile.value="";closeUpload();render()}
function home(e){if(e)e.preventDefault();render(videos)}
function trending(e){if(e)e.preventDefault();render([...videos].sort((a,b)=>parseFloat(b.v)-parseFloat(a.v)))}
function toggleSide(){side.style.display=side.style.display==="none"?"block":"none"}
render();
</script>
</body>
</html>
